version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: clashlens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clashlens
      POSTGRES_PASSWORD: clashlens
      POSTGRES_DB: clashlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clashlens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
